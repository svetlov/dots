set -g prefix C-b
# Always-on status bar at the bottom. Layout:
#   - left:   #{@waiting_prefix} (red "💬 W1, W2" written by the daemon when
#             any non-active window has a workmux waiting status; empty
#             otherwise) + the old pane-border line for the active pane
#   - middle: window list (workmux injects per-window agent status icons)
#   - right:  empty
set -g status on
set -g status-position bottom
set -g status-style "bg=default,fg=white"
# Claude's binary surfaces in pane_current_command as its version string
# (e.g. "2.1.143"). Normalize anything that looks like a SemVer back to
# "claude" for readability. False positives only happen if another tool
# also shows up as bare X.Y.Z, which is rare in practice.
# Two prefixes:
#   - @waiting_prefix: daemon-written "💬 W1, W2" for other waiting windows
#   - current-window indicator: derived inline from #{@workmux_status}
#       🤖 -> green, 💬 -> red, anything else (incl. empty) -> green ✓
# Whole status-left for the current window is wrapped in one styled block:
#   - bg=red if @workmux_status=💬 (current pane waiting)
#   - bg=green otherwise (🤖 working OR idle/ok)
# Inside: status icon + the pane-border-line content (index, custom name,
# title, cwd, command, child pid).
set -g status-left "#{@waiting_prefix}#{?#{==:#{@workmux_status},💬},#[bg=red],#[bg=colour22]}#[fg=white]#[bold] #{?#{==:#{@workmux_status},🤖},🤖,#{?#{==:#{@workmux_status},💬},💬,✓}} #{window_index}: #{?@custom_name,#{@custom_name} | ,}#{pane_title} | #{b:pane_current_path} @ #{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{pane_current_command}} #(ps -o pid= --ppid #{pane_pid} | tail -1) #[default]"
set -g status-left-length 160
set -g status-right ""
set -g status-right-length 100
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bold,reverse] #I:#W #[noreverse,nobold]"
# Auto-rename windows to the active pane's cwd basename instead of the command
# name (so claude panes show "feature-branch" not "2.1.143"). Useful for the
# ctrl+b w picker and for the waiting-window labels rendered by the daemon.
set -g automatic-rename-format "#{b:pane_current_path}"
run-shell -b '$DOTS_HOME/all/tmux/tmux-claude-status.sh'
set -g history-limit 10000
set -g mouse on
set -g xterm-keys on
setw -g mode-keys vi
# Forward FocusIn/FocusOut to applications inside tmux. nvim uses these for
# autoread (auto-reload externally-changed files on FocusGained) and many
# plugins refresh on focus. Outer terminal must support DEC 1004 (iTerm2,
# Ghostty, Kitty, WezTerm, Alacritty, Apple Terminal all do).
set -g focus-events on

# set-environment -g 'SSH_AUTH_SOCK' ~/.ssh/ssh_auth_sock
# update SSH_* env from env parent env
set-option -g update-environment "SSH_AUTH_SOCK"
set-option -g update-environment "SSH_AGENT_PID"

# see https://github.com/neovim/neovim/issues/2035 fro details
set -sg escape-time 30
# see https://github.com/tmux/tmux/issues/193 for details
set -g assume-paste-time 10

# Use vi keybindings in copy and choice modes
bind-key b copy-mode
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# Declare capabilities for xterm-256color. tmux's terminal-features is
# first-match-wins, so this explicit entry must include everything from
# the broader xterm* fallback or those features (especially `clipboard`
# for OSC 52 / pbcopy from inside tmux) get silently dropped.
#   RGB        — 24-bit true colour
#   clipboard  — OSC 52 forwarded to the outer terminal (WezTerm, iTerm2, …)
#   ccolour    — change cursor colour
#   cstyle     — change cursor style
#   focus      — FocusIn/FocusOut events (nvim autoread, etc.)
#   title      — set window title via OSC 0/2
set -as terminal-features ",xterm-256color:RGB:clipboard:ccolour:cstyle:focus:title"

# allows terminal escape sequences to pass directly through tmux
# to your terminal emulator when the pane is visible, required
# for molten-nvim / image.nvim (for ipynb neovim extensions)
set -g allow-passthrough on

# Clear images when switching tmux windows (for image.nvim)
set -g visual-activity off

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down

unbind |
bind-key | split-window -h -c '#{pane_current_path}'
unbind _
bind-key _ split-window -v -c '#{pane_current_path}'


# Smart pane switching with awareness of vim splits — Ctrl-h/j/k/l with NO
# prefix. In a vim/nvim pane, C-h/j/k/l forwards to vim where
# christoomey/vim-tmux-navigator handles vim-split navigation and crosses
# back into tmux at the split edges via `tmux select-pane`. In any other
# pane, C-h/j/k/l selects the pane directly.
#
# Caveat: this hijacks C-h (backspace) and C-j (newline) globally in
# non-vim panes. In a shell C-j will try to switch panes instead of
# inserting a newline. Use C-m (or Enter) for newlines in shells.
# Drop the previous prefix-bound h/j/k/l smart-switch bindings (tmux keeps
# old bindings across source-file unless explicitly unbound).
unbind-key -T prefix h
unbind-key -T prefix j
unbind-key -T prefix k
unbind-key -T prefix l

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n 'C-j' if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n 'C-k' if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n 'C-l' if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
# Also wire copy-mode-vi so the same keys work while scrolling.
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R


bind-key r command-prompt -p "Rename pane:" "set -p @custom_name '%%' ; run-shell -b '$DOTS_HOME/all/tmux/tmux-resurrect-save.sh'"
bind-key C-w run-shell 'PATH="$HOME/.oh-my-zsh/custom/plugins/fzf/bin:$PATH" && $DOTS_HOME/all/tmux/tmux-window-list.sh "#{session_name}:#{window_index}" "$HOME/.oh-my-zsh/custom/plugins/fzf/bin/fzf-tmux"'
bind-key w display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "workmux dashboard"
# Pane-border bar removed; its useful info now lives in status-right above.
set -g pane-border-status off
bind-key g run-shell '$DOTS_HOME/all/tmux/tmux-claude-jump.sh'

# Workmux: toggle agent sidebar / open TUI dashboard
# Sidebar manages tmux panes itself, so run-shell is fine. Dashboard is a TUI
# and needs a real TTY — use display-popup so it gets one. -d pins the popup
# cwd to the active pane (client_cwd is sometimes empty across reattaches,
# which then trips workmux's "not in git repository" check).
bind-key C-t run-shell "workmux sidebar"
bind-key C-d display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "workmux dashboard"
bind-key \\ resize-pane -Z
bind-key = select-layout even-horizontal

# Quick pane focus: jump + zoom (workmux layout: 0=agent, 1=terminal, 2=editor)
bind-key a select-pane -t :.0 \; resize-pane -Z
bind-key e select-pane -t :.2 \; resize-pane -Z
bind-key t select-pane -t :.1 \; resize-pane -Z
bind-key z resize-pane -Z

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Pane name persistence hooks for resurrect save/restore
run-shell 'tmux set -g @resurrect-hook-post-save-all "$DOTS_HOME/all/tmux/tmux-save-pane-names.sh"'
run-shell 'tmux set -g @resurrect-hook-pre-restore-pane-processes "$DOTS_HOME/all/tmux/tmux-restore-pane-names.sh"'

# Auto-save on structural changes (wrapper skips first 30s to let restore run)
set-hook -g window-linked 'run-shell -b "$DOTS_HOME/all/tmux/tmux-resurrect-save.sh"'
set-hook -g window-unlinked 'run-shell -b "$DOTS_HOME/all/tmux/tmux-resurrect-save.sh"'
set-hook -g session-created 'run-shell -b "$DOTS_HOME/all/tmux/tmux-resurrect-save.sh"'
set-hook -g session-window-changed 'run-shell -b "$DOTS_HOME/all/tmux/tmux-resurrect-save.sh"'
set-hook -g window-renamed 'run-shell -b "$DOTS_HOME/all/tmux/tmux-resurrect-save.sh"'

# for pbcopy/pbpaste
if-shell '[[ -n "$DOTS_HOME" ]] && uname | grep -q Linux' "source-file $DOTS_HOME/all/tmux/linux.conf"
if-shell '[[ -n "$DOTS_HOME" ]] && uname | grep -q Darwin' "source-file $DOTS_HOME/all/tmux/macos.conf"

# Initialize TPM
run '$DOTS_HOME/all/tmux/plugins/tpm/tpm'

# Auto-restore session on server start (bypasses tmux-continuum which silently
# fails; logs to /tmp/tmux-auto-restore.log for debugging)
run-shell -b '$DOTS_HOME/all/tmux/tmux-auto-restore.sh'
