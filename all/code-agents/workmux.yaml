nerdfont: true
agent: claude
merge_strategy: rebase
# Don't let workmux auto-apply its own per-window status format. It would set a
# per-window window-status-format that appends a bare icon and shadows our
# global colored format (see tmux.conf). workmux still sets @workmux_status on
# each window (the state the hooks write), which our format reads for color.
status_format: false
# Status icons, aligned with the tmux status-bar scheme (see tmux.conf /
# tmux-claude-status.sh). These are the literal values workmux writes to
# @workmux_status, which the bar matches on for per-window color + the tally:
#   working -> 🤖 thinking (green)
#   waiting -> ⛔ blocked on a permission/input prompt (red)
#   done    -> 💬 finished, waiting for your input (yellow)
status_icons:
  working: "🤖"
  waiting: "⛔"
  done: "💬"
# Default base for new worktrees. The `workmux add` zsh wrapper still passes an
# explicit --base origin/<detected-default> (which overrides this), so this
# value governs the paths the wrapper doesn't touch: dashboard worktree
# creation and `workmux rebase`'s fallback base. Static, so it assumes `main` —
# repos still on `master` need a per-repo .workmux.yaml override.
base_branch: origin/main
# Layout: ~/workspace/keenable/worktrees/<project>__worktrees/<branch>.
# The __worktrees suffix satisfies workmux's extract_project_name() heuristic
# so the dashboard's Project column shows the real project name, while the
# outer "worktrees" dir keeps the keenable root tidy (worktrees segregated
# from main checkouts).
worktree_dir: ~/workspace/keenable/worktrees/{project}__worktrees

files:
  copy:
    - .env

# After worktree creation: bring the new tree to a working dev state.
# Logic lives in workmux-post-create.sh (next to this file): runs
# `uv sync --group dev` with a clean fallback to plain `uv sync` when the
# repo has no PEP 735 `dev` group declared, then installs pre-commit
# hooks via `make hooks` (preferred) or `pre-commit install`.
post_create:
  - $HOME/workspace/dots/all/code-agents/workmux-post-create.sh

panes:
  - command: <agent>                 # single pane: agent, full window
