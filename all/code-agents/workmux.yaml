nerdfont: true
agent: claude
merge_strategy: rebase
# Layout: ~/workspace/keenable/worktrees/<project>__worktrees/<branch>.
# The __worktrees suffix satisfies workmux's extract_project_name() heuristic
# so the dashboard's Project column shows the real project name, while the
# outer "worktrees" dir keeps the keenable root tidy (worktrees segregated
# from main checkouts).
worktree_dir: ~/workspace/keenable/worktrees/{project}__worktrees

files:
  copy:
    - .env

# After worktree creation: install the project's git pre-commit hooks so
# commits in the new worktree go through the same lint/format gate as the
# main checkout. Tries `make hooks` first (some repos do more than just
# `pre-commit install` — e.g. dependency setup) and falls back to bare
# `pre-commit install` when a .pre-commit-config.yaml is present.
# Best-effort: anything that fails here doesn't abort worktree creation.
post_create:
  - sh -c 'if make -n hooks >/dev/null 2>&1; then make hooks; elif [ -f .pre-commit-config.yaml ] && command -v pre-commit >/dev/null 2>&1; then pre-commit install; fi'

panes:
  - command: <agent>                # pane 0: agent, full window
  - split: vertical                  # pane 1: terminal (bottom, full width)
    percentage: 25
  - command: nvim                    # pane 2: editor (top right)
    split: horizontal
    target: 0
    focus: true
